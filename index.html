<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Library — Eracom</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script defer src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="iconGallery()" :style="`--icon-size: ${iconSize}px`">

  <!-- Header -->
  <header class="iconlib-header">
    <a href="#" @click.prevent="resetHome()" class="iconlib-logo">Icon Library</a>
    <nav class="iconlib-nav" aria-label="Navigation principale">
      <a href="index.html" class="iconlib-nav-link">Accueil</a>
      <a href="index.html" class="iconlib-nav-link">Icônes</a>
      <a href="about.html" class="iconlib-nav-link">À propos</a>
      <a href="licence.html" class="iconlib-nav-link">Licence</a>
    </nav>
    <button class="iconlib-hamburger" @click="menuOpen = !menuOpen" :aria-expanded="menuOpen.toString()" aria-label="Menu">
      <span class="iconlib-hamburger-bar" aria-hidden="true"></span>
      <span class="iconlib-hamburger-bar" aria-hidden="true"></span>
      <span class="iconlib-hamburger-bar" aria-hidden="true"></span>
    </button>
  </header>

  <!-- Mobile menu -->
  <nav x-show="menuOpen" class="iconlib-mobile-menu" aria-label="Menu mobile" @keydown.escape.window="menuOpen = false">
    <a href="index.html" class="iconlib-mobile-menu-link" @click="menuOpen = false">Accueil <span aria-hidden="true">→</span></a>
    <a href="index.html" class="iconlib-mobile-menu-link" @click="menuOpen = false">Icônes <span aria-hidden="true">→</span></a>
    <a href="about.html" class="iconlib-mobile-menu-link" @click="menuOpen = false">À propos <span aria-hidden="true">→</span></a>
    <a href="licence.html" class="iconlib-mobile-menu-link" @click="menuOpen = false">Licence <span aria-hidden="true">→</span></a>
  </nav>

  <!-- Toolbar: search + categories + size slider -->
  <div class="iconlib-toolbar">
    <div class="iconlib-toolbar-top">
      <div class="iconlib-search-wrap">
        <label for="search" class="sr-only">Rechercher une icône</label>
        <input
          id="search"
          name="search"
          type="search"
          x-model="search"
          placeholder="Chercher"
          autocomplete="off"
          class="iconlib-search-input"
        >
        <button class="iconlib-search-btn" aria-label="Rechercher" tabindex="-1">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5"/>
            <line x1="13" y1="13" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="iconlib-categories-wrap">
        <label for="cat-filter" class="sr-only">Filtrer par catégorie</label>
        <select id="cat-filter" class="iconlib-categories-select" x-model="categoryFilter">
          <option value="">Catégories</option>
          <template x-for="cat in categories" :key="cat.id">
            <option :value="cat.id" x-text="cat.label"></option>
          </template>
        </select>
        <span class="iconlib-categories-arrow" aria-hidden="true">▾</span>
      </div>
    </div>
    <div class="iconlib-slider-row">
      <button class="iconlib-slider-btn" @click="iconSize = Math.max(32, iconSize - 8)" aria-label="Réduire les icônes">−</button>
      <input
        type="range"
        class="iconlib-size-slider"
        min="32"
        max="96"
        step="8"
        x-model.number="iconSize"
        aria-label="Taille des icônes"
      >
      <button class="iconlib-slider-btn" @click="iconSize = Math.min(96, iconSize + 8)" aria-label="Agrandir les icônes">+</button>
    </div>
  </div>

  <!-- Main -->
  <main class="iconlib-main">
    <template x-if="error">
      <div class="iconlib-error" role="alert">Impossible de charger les icônes. Veuillez réessayer plus tard.</div>
    </template>
    <div x-show="!error">

      <!-- Search results -->
      <div x-show="searchActive">
        <div class="iconlib-grid">
          <template x-for="icon in searchResults" :key="icon.id">
            <button class="iconlib-card" @click="openModal(icon, icon.categoryObj)" :aria-label="icon.name">
              <img :src="icon.file" :alt="icon.name" class="iconlib-img" @error="hideIcon(icon, icon.categoryObj)">
              <span class="iconlib-name" x-text="icon.name"></span>
            </button>
          </template>
        </div>
        <template x-if="searchResults.length === 0">
          <div class="iconlib-empty">Aucune icône trouvée pour «&nbsp;<span x-text="search"></span>&nbsp;»</div>
        </template>
      </div>

      <!-- Category sections -->
      <div x-show="!searchActive">
        <template x-for="cat in filteredCategories" :key="cat.id">
          <section class="iconlib-category" x-show="cat.icons.length">
            <h2 class="iconlib-category-title">
              <span class="iconlib-category-title-label" x-text="cat.label"></span>
              <span class="iconlib-category-count" x-text="`(${cat.icons.length})`"></span>
            </h2>
            <div class="iconlib-grid">
              <template x-for="icon in (isCategoryExpanded(cat.id) ? cat.icons : cat.icons.slice(0, 6))" :key="icon.id">
                <button class="iconlib-card" @click="openModal(icon, cat)" :aria-label="icon.name">
                  <img :src="icon.file" :alt="icon.name" class="iconlib-img" @error="hideIcon(icon, cat)">
                  <span class="iconlib-name" x-text="icon.name"></span>
                </button>
              </template>
            </div>
            <template x-if="cat.icons.length > 6 && !categoryFilter">
              <button
                class="iconlib-voir-plus"
                @click="toggleCategory(cat.id)"
                x-text="isCategoryExpanded(cat.id) ? 'voir moins' : `voir ${cat.icons.length - 6} de plus`"
              ></button>
            </template>
          </section>
        </template>
      </div>

    </div>
  </main>

  <!-- Modal panel -->
  <div
    x-show="modalOpen"
    class="iconlib-modal-panel"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    :aria-label="modalIcon ? modalIcon.name : 'Détail icône'"
    @keydown.escape.window="closeModal"
  >
    <template x-if="modalIcon">
      <div>
        <!-- Square block (1:1): close button, icon preview and name -->
        <div class="iconlib-modal-stage">
          <button class="iconlib-modal-close" @click="closeModal" aria-label="Fermer">✕</button>

          <!-- Icon preview — always via img, SVG is fetched separately for copy -->
          <div class="iconlib-modal-preview">
            <img :src="modalIcon.file" :alt="modalIcon.name">
          </div>

          <h3 class="iconlib-modal-name" x-text="modalIcon.name"></h3>
        </div>

        <!-- Author -->
        <template x-if="modalIcon.author">
          <div class="iconlib-modal-row">
            <span x-text="'Auteur\u202F: ' + modalIcon.author"></span>
          </div>
        </template>

        <!-- Class -->
        <template x-if="modalIcon.class">
          <div class="iconlib-modal-row">
            <span x-text="'Classe\u202F: ' + modalIcon.class"></span>
          </div>
        </template>

        <!-- Description -->
        <template x-if="modalIcon.description">
          <div class="iconlib-modal-row">
            <span x-text="modalIcon.description"></span>
          </div>
        </template>

        <!-- Download -->
        <div class="iconlib-modal-row iconlib-modal-row-action">
          <a class="iconlib-modal-download" :href="modalIcon.file" :download="modalIcon.name + '.svg'" @click="markDownloaded()">Télécharger SVG</a>
          <img class="iconlib-modal-action-icon" :src="downloaded ? 'assets/file_download_done.svg' : 'assets/file_download.svg'" alt="" aria-hidden="true">
        </div>

        <!-- Copy -->
        <div class="iconlib-modal-row iconlib-modal-row-action iconlib-modal-row-last" @click="copySvg()">
          <button class="iconlib-modal-copy-btn" x-text="copied ? 'Copié !' : 'Copier SVG'"></button>
          <img class="iconlib-modal-action-icon" :src="copied ? 'assets/done.svg' : 'assets/content_copy.svg'" alt="" aria-hidden="true">
        </div>

        <!-- Fallback textarea -->
        <template x-if="copyFallback">
          <div class="iconlib-modal-fallback">
            <label for="svg-fallback">Copiez le code SVG&nbsp;:</label>
            <textarea id="svg-fallback" readonly x-text="modalSvg" @focus="$event.target.select()"></textarea>
          </div>
        </template>

        <!-- Error -->
        <template x-if="modalError">
          <div class="iconlib-modal-error" x-text="modalError"></div>
        </template>
      </div>
    </template>
  </div>

</body>
</html>
